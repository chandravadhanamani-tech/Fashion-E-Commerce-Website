{% extends "base.html" %}

{% block title %}Checkout | Aura Store{% endblock %}

{% block content %}
<div class="container px-lg-5 py-4">
    <h2 class="brand-font mb-4 text-white"><i class="bi bi-shield-check text-pink me-2"></i>Checkout & Order Confirmation</h2>

    <form id="checkoutForm" onsubmit="handlePlaceOrder(event)">
        <div class="row g-4">
            <!-- Shipping & Payment Form -->
            <div class="col-lg-7">
                <div class="card bg-card border-secondary rounded-4 p-4 mb-4">
                    <h5 class="brand-font text-white mb-3"><i class="bi bi-geo-alt text-pink me-2"></i>Shipping Address</h5>
                    <div class="mb-3">
                        <label class="form-label text-secondary small">Full Address</label>
                        <textarea id="shippingAddress" class="form-control bg-dark text-white border-secondary" rows="3" placeholder="Street name, suite/apartment, City, State, ZIP code" required>123 Fashion Avenue, Suite 500, New York, NY 10001</textarea>
                    </div>
                </div>

                <div class="card bg-card border-secondary rounded-4 p-4">
                    <h5 class="brand-font text-white mb-3"><i class="bi bi-credit-card text-pink me-2"></i>Payment Method</h5>
                    <div class="form-check p-3 border border-secondary rounded-3 mb-2 bg-dark d-flex align-items-center justify-content-between">
                        <div>
                            <input class="form-check-input me-2" type="radio" name="paymentMethod" id="payCC" value="Credit Card" checked>
                            <label class="form-check-label text-white font-weight-bold" for="payCC">Credit / Debit Card</label>
                        </div>
                        <i class="bi bi-credit-card-2-front text-pink fs-4"></i>
                    </div>
                    <div class="form-check p-3 border border-secondary rounded-3 mb-2 bg-dark d-flex align-items-center justify-content-between">
                        <div>
                            <input class="form-check-input me-2" type="radio" name="paymentMethod" id="payPP" value="PayPal">
                            <label class="form-check-label text-white font-weight-bold" for="payPP">PayPal</label>
                        </div>
                        <i class="bi bi-paypal text-cyan fs-4"></i>
                    </div>
                    <div class="form-check p-3 border border-secondary rounded-3 bg-dark d-flex align-items-center justify-content-between">
                        <div>
                            <input class="form-check-input me-2" type="radio" name="paymentMethod" id="payCOD" value="Cash on Delivery">
                            <label class="form-check-label text-white font-weight-bold" for="payCOD">Cash on Delivery</label>
                        </div>
                        <i class="bi bi-cash-stack text-success fs-4"></i>
                    </div>
                </div>
            </div>

            <!-- Order Summary Sidebar -->
            <div class="col-lg-5">
                <div class="card bg-card border-secondary rounded-4 p-4">
                    <h5 class="brand-font text-white mb-3">Summary</h5>
                    <div id="checkoutSummaryItems" class="mb-3"></div>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between text-secondary mb-2">
                        <span>Subtotal</span>
                        <span class="text-white font-weight-bold" id="coSubtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between text-secondary mb-2">
                        <span>Tax (8%)</span>
                        <span class="text-white" id="coTax">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between text-secondary mb-3">
                        <span>Shipping</span>
                        <span class="text-white" id="coShipping">$0.00</span>
                    </div>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="text-white font-weight-bold fs-5">Total Pay</span>
                        <span class="text-pink font-weight-bold fs-3" id="coTotal">$0.00</span>
                    </div>
                    <button type="submit" id="placeOrderBtn" class="btn btn-gradient btn-lg w-100 py-3 font-weight-bold">
                        <i class="bi bi-check-circle me-2"></i> Place Order Now
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    if (!getAuthToken()) {
        window.location.href = '/auth';
        return;
    }
    await loadCheckoutSummary();
});

async function loadCheckoutSummary() {
    try {
        const res = await fetch('/api/v1/cart/', { headers: authHeaders() });
        if (!res.ok) throw new Error('Failed to fetch cart summary');
        const cart = await res.json();

        if (!cart.items || cart.items.length === 0) {
            alert('Your cart is empty.');
            window.location.href = '/cart';
            return;
        }

        const itemsBox = document.getElementById('checkoutSummaryItems');
        itemsBox.innerHTML = '';
        cart.items.forEach(i => {
            itemsBox.innerHTML += `
                <div class="d-flex justify-content-between align-items-center mb-2 fs-7">
                    <span class="text-white">${i.quantity}x ${i.product_name} (<strong class="text-pink">${i.size}</strong>)</span>
                    <span class="text-pink font-weight-bold">$${i.total_price.toFixed(2)}</span>
                </div>
            `;
        });

        document.getElementById('coSubtotal').innerText = `$${cart.subtotal.toFixed(2)}`;
        document.getElementById('coTax').innerText = `$${cart.tax.toFixed(2)}`;
        document.getElementById('coShipping').innerText = cart.shipping === 0 ? 'FREE' : `$${cart.shipping.toFixed(2)}`;
        document.getElementById('coTotal').innerText = `$${cart.grand_total.toFixed(2)}`;

    } catch (e) {
        console.error(e);
    }
}

async function handlePlaceOrder(e) {
    e.preventDefault();
    const btn = document.getElementById('placeOrderBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Processing...';

    const address = document.getElementById('shippingAddress').value;
    const payMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

    try {
        const res = await fetch('/api/v1/orders/checkout', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ shipping_address: address, payment_method: payMethod })
        });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || 'Checkout failed');
        }

        const order = await res.json();
        await updateCartCount();
        alert(`Order Placed Successfully! Order #${order.order_number}`);
        window.location.href = '/profile#orders';
    } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-circle me-2"></i> Place Order Now';
        alert('Order Error: ' + err.message);
    }
}
</script>
{% endblock %}
